name: Build Android APK

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch uses that name
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Standalone Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper # This will automatically fetch the correct version from your project properties

    - name: Build Debug APK
      run: gradle assembleDebug # Notice we use 'gradle' directly instead of './gradlew'

    - name: Upload Downloadable APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
